server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: mingli-backend
  profiles:
    active: mysql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  # 首次启动自动建表并写入规则字典
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      # 关键：强制以 UTF-8 读取脚本，否则 Windows 平台默认 GBK 会把中文乾坤/地支读成乱码，
      # 导致 dict_lushen/dict_gan_wuxiang/dict_zhi_wuxiang 等以中文为唯一键的表插入时触发唯一约束冲突而整条插入被丢弃。
      encoding: UTF-8
      continue-on-error: true
      separator: ;
  datasource:
    hikari:
      # 数据库不可用时也允许启动，排盘与推理仍可用（字典回退内置默认）
      initialization-fail-timeout: -1
      connection-timeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mingli.entity
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
    call-setters-on-nulls: true

logging:
  level:
    com.mingli: info

---
# ===================== MySQL 配置（唯一数据源，生产 / 本地均适用） =====================
# 敏感信息（主机 / 账号 / 密码）全部从环境变量读取，源码不落明文字段：
#   DB_HOST             连接主机（本地默认 127.0.0.1；Docker 部署由 compose 注入远程库地址）
#   DB_PORT             端口（默认 3306）
#   DB_NAME             库名（默认 mingli）
#   DB_USERNAME         账号（默认 root，按远程库实际账号填写）
#   DB_PASSWORD         密码（默认占位 changeme，生产务必通过环境变量 / .env 提供强密码）
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:-127.0.0.1}:${DB_PORT:-3306}/${DB_NAME:-mingli}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true"
    username: ${DB_USERNAME:-root}
    password: ${DB_PASSWORD:-changeme}
