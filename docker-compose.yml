# 玄枢 · 盲派八字命理平台 —— Docker Compose 部署
#
# 数据库使用外部远程 MySQL（不在本 compose 内启容器），请通过 .env 提供连接信息。
# 构建并启动： docker compose up -d --build
# 停止：       docker compose down
# 访问地址：   http://<服务器IP>   （前端映射宿主机 80 端口）
#
# 敏感配置（密码等）请用 .env 覆盖，切勿把含真实密码的 .env 提交到仓库。
# 本文件变量默认值仅为占位（changeme），生产务必通过 .env 设置真实远程库信息：
#   DB_HOST=your-remote-mysql-host   （远程数据库主机，必填）
#   DB_PORT=3306
#   DB_NAME=mingli
#   DB_USERNAME=mingli_user
#   DB_PASSWORD=change_me_to_a_strong_password
# 复制 .env.example 为 .env 后按需修改即可。

services:
  # ---------------- 后端（Spring Boot） ----------------
  backend:
    build:
      context: ./mingli-backend
    image: mingli-backend:1.0.0
    container_name: mingli-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      # 以下变量注入后端 application.yml 的 ${DB_HOST} / ${DB_PASSWORD} 等占位符
      # DB_HOST 必须指向你的远程 MySQL 主机（云数据库/RDS 连接地址或服务器 IP）
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mingli}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      TZ: Asia/Shanghai
    # 只对 compose 内部网络暴露 8080；如需宿主机调试可加 ports: - "8080:8080"
    expose:
      - "8080"
    networks:
      - mingli-net

  # ---------------- 前端（nginx 托管 + 反向代理） ----------------
  frontend:
    build:
      context: ./mingli-web
    image: mingli-web:1.0.0
    container_name: mingli-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    # 挂可写内存盘，确保 nginx 运行时临时目录可写
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    # 放开 seccomp：该宿主的 seccomp 策略拦截了 nginx 写 PID 使用的 pwrite64 系统调用
    # （error.log 走 write() 正常，PID 走 pwrite() 被拦，故报 Operation not permitted）。
    # 放开后 nginx 才能正常写 PID 与运行时临时目录。
    security_opt:
      - seccomp=unconfined
    networks:
      - mingli-net

networks:
  mingli-net:
    driver: bridge
