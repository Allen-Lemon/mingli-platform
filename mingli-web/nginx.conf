# 玄枢 · 前端主配置（nginx）
# 说明：pid 指向 /tmp 而非默认 /run，避免某些容器环境下 /run 不可写导致
#       nginx 启动失败（报错 pwrite() "/run/nginx.pid" failed: Operation not permitted）。
#       /tmp 权限为 1777，任何用户均可写，兼容性最好。

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 前端路由（Vue history 模式）：找不到文件时回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反向代理
        # 注意：proxy_pass 结尾【不要】加 / ，否则 /api 前缀会被剥离，
        # 而后端控制器本身就在 /api 下（@RequestMapping("/api/...")），剥离后会 404。
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 排盘结果 JSON 可能较大，放宽请求体上限
        client_max_body_size 20m;

        # 开启 gzip 压缩
        gzip on;
        gzip_min_length 1024;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    }
}
